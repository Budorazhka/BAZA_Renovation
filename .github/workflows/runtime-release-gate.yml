name: Runtime release gate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/integration

permissions:
  contents: read

concurrency:
  group: runtime-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Compose + Playwright runtime gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Keep CI deterministic and separate from any hosted runner defaults.
      MONGO_REPLICA_SET_NAME: rs0
      MONGO_PORT: 27017
      REDIS_PASSWORD: dev_redis_password
      REDIS_PORT: 6379
      MINIO_ACCESS_KEY: dev_minio_access
      MINIO_SECRET_KEY: dev_minio_secret
      MINIO_BUCKET_PRIVATE: baza-private
      MINIO_BUCKET_PUBLIC: baza-public
      MINIO_PORT: 9000
      MINIO_CONSOLE_PORT: 9001
      API_PORT: 3000
      ADMIN_WEB_PORT: 4174
      MARKETPLACE_WEB_PORT: 4173
      ERP_WEB_PORT: 4175
      CORS_ALLOWED_ORIGIN_MARKETPLACE: http://localhost:4173
      CORS_ALLOWED_ORIGIN_ADMIN: http://localhost:4174
      CORS_ALLOWED_ORIGIN_ERP: http://localhost:4175
      # The browser runs on the runner, while API/worker run in containers.
      # extra_hosts in compose.runtime.yml makes this name resolve on Linux.
      MINIO_ENDPOINT: http://host.docker.internal:9000
      MINIO_PUBLIC_BASE_URL: http://localhost:9000/baza-public
      RUNTIME_API_URL: http://localhost:3000
      RUNTIME_API_BASE_PATH: /api/v1
      RUNTIME_MARKETPLACE_URL: http://localhost:4173
      RUNTIME_MARKETPLACE_ORIGIN: http://localhost:4173
      RUNTIME_ADMIN_URL: http://localhost:4174
      RUNTIME_ADMIN_ORIGIN: http://localhost:4174
      RUNTIME_ERP_URL: http://localhost:4175
      RUNTIME_ERP_ORIGIN: http://localhost:4175
      RUNTIME_MONGO_URI: mongodb://localhost:27017/baza?replicaSet=rs0&directConnection=true
      RUNTIME_MONGO_HOST: localhost
      RUNTIME_MONGO_PORT: 27017
      RUNTIME_REDIS_HOST: localhost
      RUNTIME_REDIS_PORT: 6379
      RUNTIME_MINIO_URL: http://localhost:9000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build workspace
        run: pnpm build

      - name: Install Chromium and system dependencies
        run: pnpm --filter @baza/e2e-runtime exec playwright install --with-deps chromium

      # Задача №3 из docs/codex/plans/2026-08-30-runtime-ci-gate.md
      # («Make host.docker.internal resolve on Linux runners»), которая так и
      # не была выполнена — из-за этого тест публикации падал на КАЖДОМ
      # прогоне гейта, начиная с самого первого (30.08.2026).
      #
      # API подписывает presigned-ссылку на загрузку адресом из
      # MINIO_ENDPOINT, то есть http://host.docker.internal:9000. Внутри
      # контейнеров это имя резолвится через extra_hosts в
      # compose.runtime.yml, но PUT по этой ссылке делает БРАУЗЕР, который
      # работает на самом раннере, — а там такого имени нет, и запрос
      # умирает на DNS. Дальше мастер публикации не доходит до confirm, и
      # тест валится по таймауту ожидания ответа.
      #
      # 127.0.0.1 корректен для обеих сторон: браузер попадает на
      # опубликованный порт MinIO, контейнеры — через host-gateway. Подпись
      # остаётся валидной, потому что Host-заголовок в обоих случаях один и
      # тот же.
      - name: Make host.docker.internal resolvable on the runner
        run: |
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          getent hosts host.docker.internal

      - name: Validate runtime Compose configuration
        run: pnpm runtime:config

      - name: Start runtime Compose stack
        run: pnpm runtime:up

      - name: Run runtime preflight
        run: pnpm runtime:preflight

      - name: Run real Playwright runtime gate
        run: pnpm runtime:e2e -- --project chromium --reporter=list --retries=1

      # Снимки экранов для сверки с Figma. Делаются здесь, а не на машине
      # разработчика: поднятый стек с реальными данными есть только тут, и
      # снимки получаются повторяемыми, а не «как было у меня локально».
      #
      # continue-on-error: снимки — материал для сверки, а не критерий приёмки.
      # Сбой съёмки не должен красить гейт, который проверяет работу продукта.
      - name: Capture marketplace screenshots
        if: always()
        continue-on-error: true
        env:
          BASE_URL: ${{ env.RUNTIME_MARKETPLACE_URL }}
        run: node apps/e2e-runtime/scripts/capture-marketplace-screens.mjs

      - name: Upload marketplace screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-screenshots
          path: docs/discovery/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-playwright-artifacts
          path: |
            apps/e2e-runtime/playwright-report
            apps/e2e-runtime/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump runtime service status on failure
        if: failure()
        run: pnpm runtime:ps && docker compose -f infrastructure/compose/compose.runtime.yml logs --no-color --tail=200

      - name: Stop runtime Compose stack
        if: always()
        run: pnpm runtime:down
