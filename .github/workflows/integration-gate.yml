name: Integration gate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: HTTP and module integration gate
    runs-on: ubuntu-latest
    # Реальная длительность сьюта на раннере — 3.5 минуты (замер
    # 01.09.2026). До этого гейт не завершался НИ РАЗУ и убивался по
    # таймауту, но причина была не в нехватке времени: jest проходил все
    # тесты и не выходил, вися на хендлах ioredis (см.
    # jest.integration.config.js, forceExit). 20 минут — запас почти в
    # шесть раз, его достаточно.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 11.09.2026: без кеша каждый прогон — холодный раннер, и test:integration
      # запускает десятки файлов параллельно (jest по умолчанию — воркер на
      # ядро), каждый со своим beforeAll → MongoMemoryReplSet.create(). Когда
      # бинарник mongod ещё не скачан, несколько воркеров одновременно пытаются
      # его закачать и упираются в баг координации между процессами в
      # mongodb-memory-server-core@11.2.0: UnableToUnlockLockfileError
      # (~/.cache/mongodb-binaries/8.2.6.lock «not locked by this process») —
      # видели дважды за сессию (marketplace-property-assets.integration-spec.ts
      # на 6226631 и 833aa6e), оба раза только этот один файл и оба раза сам
      # тест не имеет отношения к пушу. С тёплым кешем ни один воркер вообще не
      # обращается к сети — MongoBinary.getPath() находит файл на диске.
      - name: Cache MongoDB binaries for mongodb-memory-server
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Report runner capacity
        run: |
          echo "CPU: $(nproc)"
          free -h || true
          ls -la ~/.cache/mongodb-binaries 2>/dev/null || echo "mongod binary not downloaded yet"

      # --log-order=stream: по умолчанию turbo группирует вывод задачи и
      # печатает его только после завершения. Именно поэтому оба прошлых
      # падения выглядели как «19 минут тишины, затем отмена» — понять,
      # висит сборка или тесты, было невозможно. Со стримом виден прогресс
      # jest по файлам. (--output-logs принимает full/none/hash-only/
      # new-only/errors-only, значения stream у него нет.)
      - name: Run HTTP and module integration tests
        run: pnpm exec turbo run test:integration --output-logs=full --log-order=stream

      - name: Check git formatting and whitespace
        run: git diff --check
