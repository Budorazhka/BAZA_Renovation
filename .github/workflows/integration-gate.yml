name: Integration gate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: HTTP and module integration gate
    runs-on: ubuntu-latest
    # 40, а не 20: за всю историю этот гейт не завершился НИ РАЗУ — оба
    # прогона (31.08.2026 на codex/integration и 01.09.2026 на этой ветке)
    # были убиты ровно на 20-й минуте, не оставив ни строки вывода тестов.
    # Пока не измерена настоящая длительность сьюта на раннере, лимит
    # держится выше неё; вернуть к жёсткому значению после замера.
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report runner capacity
        run: |
          echo "CPU: $(nproc)"
          free -h || true
          ls -la ~/.cache/mongodb-binaries 2>/dev/null || echo "mongod binary not downloaded yet"

      # --log-order=stream: по умолчанию turbo группирует вывод задачи и
      # печатает его только после завершения. Именно поэтому оба прошлых
      # падения выглядели как «19 минут тишины, затем отмена» — понять,
      # висит сборка или тесты, было невозможно. Со стримом виден прогресс
      # jest по файлам. (--output-logs принимает full/none/hash-only/
      # new-only/errors-only, значения stream у него нет.)
      - name: Run HTTP and module integration tests
        run: pnpm exec turbo run test:integration --output-logs=full --log-order=stream

      - name: Check git formatting and whitespace
        run: git diff --check
