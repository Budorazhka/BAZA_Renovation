name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build workspace packages and apps
        run: pnpm build

      - name: Verify generated API client is up to date
        run: node packages/api-client/scripts/check-stale.mjs

      - name: Verify OpenAPI contract layout and schema integrity
        run: node packages/api-client/scripts/verify-contract-layout.mjs

      - name: Check git formatting and whitespace
        run: git diff --check
