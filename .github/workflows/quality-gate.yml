name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      # Lint не входил НИ В ОДИН workflow — из-за этого он тихо зарос до
      # 26 ошибок (21 no-explicit-any + 5 неиспользуемых импортов),
      # и `pnpm lint` перестал быть полезным сигналом: он всегда был
      # красным, поэтому его перестали запускать. Ошибки исправлены
      # 01.09.2026, шаг добавлен, чтобы это не повторилось.
      #
      # ЧЕСТНЫЙ ПРОБЕЛ (обнаружен 10.09.2026): apps/erp-web НЕ участвует в
      # этом шаге — его package.json называет скрипт `lint:local`, а не
      # `lint`, поэтому turbo (который просто пропускает пакеты без задачи
      # `lint`, не роняя пайплайн) молча его не проверяет. Причина —
      # 1269 существующих ошибок eslint в вендоренном коде (26 ошибок из
      # комментария выше — были в остальном workspace, это другое). Ранее
      # (02–04.09.2026) erp-web был явно и осознанно исключён из
      # pnpm-workspace.yaml с тем же обоснованием; при включении его в
      # workspace 09.09.2026 явное исключение из pnpm-workspace.yaml сняли,
      # но по-старому явного исключения из lint НЕ завели — вместо этого
      # тихо переименовали скрипт внутри фичевого коммита. Пока отдельная
      # задача на чистку легаси-долга не закрыта, `pnpm --filter @baza/erp-web
      # lint:local` можно гонять вручную; новый код в erp-web стоит
      # проверять локально тем же скриптом перед коммитом.
      - name: Lint workspace
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build workspace packages and apps
        run: pnpm build

      - name: Verify generated API client is up to date
        run: node packages/api-client/scripts/check-stale.mjs

      - name: Verify OpenAPI contract layout and schema integrity
        run: node packages/api-client/scripts/verify-contract-layout.mjs

      - name: Check git formatting and whitespace
        run: git diff --check
