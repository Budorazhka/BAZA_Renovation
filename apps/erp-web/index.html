<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#178b00" />
    <meta name="msapplication-navbutton-color" content="#178b00" />
    <style>
      body.unit-visit-chrome-baza,
      html.unit-visit-chrome-baza {
        background-color: #178b00 !important;
      }
    </style>
    <title>BAZA.sale</title>
    <script>
      (function () {
        var hash = location.hash || '';
        if (hash.indexOf('#/lot/') === -1) return;
        var query = hash.split('?')[1] || '';
        var thm = new URLSearchParams(query).get('thm');
        var colors = {
          d: '#07120a',
          dark: '#07120a',
          b: '#178b00',
          baza: '#178b00',
          l: '#faf7f2',
          light: '#faf7f2',
        };
        var color = colors[thm] || '#07120a';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', color);
        var msMeta = document.querySelector('meta[name="msapplication-navbutton-color"]');
        if (msMeta) msMeta.setAttribute('content', color);
        document.documentElement.style.backgroundColor = color;
        document.body.style.backgroundColor = color;
        if (thm === 'b' || thm === 'baza') {
          document.documentElement.classList.add('unit-visit-chrome-baza');
          document.body.classList.add('unit-visit-chrome-baza');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
