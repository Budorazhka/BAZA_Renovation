        Для own-scope проверяется транзитивная принадлежность контакта менеджеру через лиды.
      tags: [erp-crm]
      parameters:
        - name: contactId
          in: path
          required: true
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string, enum: [lead_stage_changed, lead_assigned, task_created, task_updated, task_completed, task_cancelled, audit_event]}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Timeline активности контакта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет contact.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — контакт не существует или вне permission scope
          $ref: '#/components/responses/Error'

  /tasks:
    get:
      operationId: listTasks
      summary: >
        Список задач текущей организации, newest-first, cursor-paginated.
        organization-scope (owner/director/rop/administrator/developer)
        видит все задачи tenant'а; own-scope (manager) видит только задачи,
        назначенные на его собственную Position — сужение применяется на
        backend до чтения.
      tags: [erp-crm]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [open, completed, cancelled]}
        - name: assignedPositionId
          in: query
          schema: {type: string}
        - name: leadId
          in: query
          schema: {type: string}
        - name: contactId
          in: query
          schema: {type: string}
        - name: dueBefore
          in: query
          schema: {type: string, format: date-time}
        - name: dueAfter
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Задачи текущего tenant/scope, newest-first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          description: VALIDATION_FAILED — невалидные фильтры или assignedPositionId вне scope
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION — нет baza_session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.read
          $ref: '#/components/responses/Error'

    post:
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: Создание новой CRM-задачи с опциональной привязкой к лиду и контакту
      tags: [erp-crm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.create
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — указанный leadId или contactId не найден
          $ref: '#/components/responses/Error'

  /tasks/{taskId}:
    get:
      operationId: getTask
      summary: >
        Получение задачи по ID. Tenant и own-scope проверяются до чтения —
        чужая задача возвращает 404 (non-disclosure).
      tags: [erp-crm]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Задача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'

    patch:
      operationId: updateTask
      summary: >
        Частичное обновление задачи (заголовок, описание, срок, статус) —
        НИКОГДА исполнителя (assignedPositionId): смена исполнителя только
        через PATCH /tasks/{taskId}/reassign, отдельный grant task.reassign,
        тот же принцип, что lead.assign отделён от lead.changeStage.
        expectedVersion обязателен (conventions.md разд.5 optimistic
        concurrency, тот же паттерн, что PATCH /leads/{leadId}/stage).
      tags: [erp-crm]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: VALIDATION_FAILED / Нельзя редактировать завершённую задачу
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.edit
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — expectedVersion устарел, обновите и повторите
          $ref: '#/components/responses/Error'

  /tasks/{taskId}/reassign:
    patch:
      operationId: reassignTask
      summary: >
        Смена исполнителя задачи (assignedPositionId) — отдельный grant
        task.reassign (owner-подтверждено 30.08.2026, не task.edit).
        own-scope (manager) может переназначить ТОЛЬКО задачу, уже
        назначенную на себя, и ТОЛЬКО на себя же (либо снять назначение
        через assignedPositionId:null) — не может передать задачу коллеге.
        expectedVersion обязателен (conventions.md разд.5).
      tags: [erp-crm]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignTaskRequest'
      responses:
        '200':
          description: Задача переназначена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: VALIDATION_FAILED — assignedPositionId вне permission scope вызывающего
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.reassign
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — задача или новый assignedPositionId (Position) не найдены/вне tenant
          $ref: '#/components/responses/Error'
        '409':
          description: >
            Position closed (ConflictException — переиспользует OrganizationsService.findAssignablePosition,
            тот же путь, что POST /leads/{leadId}/assign) ИЛИ VERSION_CONFLICT — expectedVersion устарел
          $ref: '#/components/responses/Error'

  /tasks/{taskId}/complete:
    post:
      operationId: completeTask
      summary: >
        Завершение задачи (перевод в статус completed с фиксацией времени и
        исполнителя). Идемпотентно на уровне "уже completed" — повторный
        вызов ЛЮБЫМ expectedVersion после успешного завершения просто
        возвращает текущее состояние (200), не 409/404 — безопасно вызывать
        повторно. Сам переход open→completed версионирован
        (conventions.md разд.5): устаревший expectedVersion на ОТКРЫТОЙ
        задаче — 409, не молчаливый lost update.
      tags: [erp-crm]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
      responses:
        '200':
          description: Задача завершена (или уже была завершена — идемпотентный повтор)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет task.complete
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — expectedVersion устарел на ЕЩЁ ОТКРЫТОЙ задаче, обновите и повторите
          $ref: '#/components/responses/Error'

  /deals:
    get:
      operationId: listDeals
      summary: >
        Список сделок текущей организации, newest-first, cursor-paginated.
        organization-scope (owner/director/rop/developer) видит все сделки tenant'а;
        own-scope (manager) видит только сделки, где ownerPositionId === собственная Position.
      tags: [erp-crm]
      parameters:
        - name: stage
          in: query
          schema:
            $ref: '#/components/schemas/DealStage'
        - name: ownerPositionId
          in: query
          schema: {type: string}
        - name: leadId
          in: query
          schema: {type: string}
        - name: contactId
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Сделки текущего tenant/scope, newest-first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealListResponse'
        '400':
          description: VALIDATION_FAILED — невалидные фильтры или ownerPositionId вне scope
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION — нет session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.read
          $ref: '#/components/responses/Error'

    post:
      operationId: createDeal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: Создание новой CRM-сделки
      tags: [erp-crm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDealRequest'
      responses:
        '201':
          description: Сделка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.create
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — указанный contactId или leadId не найден в организации
          $ref: '#/components/responses/Error'

  /deals/{dealId}:
    get:
      operationId: getDeal
      summary: >
        Получение детальной информации о сделке.
        Tenant и own-scope проверяются до чтения — чужая сделка возвращает 404 (non-disclosure).
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Сделка найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — сделка не найдена
          $ref: '#/components/responses/Error'

    patch:
      operationId: updateDeal
      summary: >
        Частичное обновление сделки с optimistic concurrency (заголовок,
        описание, комиссия). НЕ меняет ownerPositionId — см.
        PATCH /deals/{dealId}/reassign (client.reassign, отдельный grant
        от deal.edit).
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDealRequest'
      responses:
        '200':
          description: Сделка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.edit
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — сделка была изменена параллельным запросом
          $ref: '#/components/responses/Error'

  /deals/{dealId}/reassign:
    patch:
      operationId: reassignDeal
      summary: >
        Смена ответственного за сделку (ownerPositionId) — отдельный grant
        client.reassign (owner/director/rop, scope organization),
        не deal.edit. Тот же принцип, что PATCH /tasks/{taskId}/reassign
        отделён от task.edit. ownerPositionId у сделки обязательное поле —
        endpoint не поддерживает "снять ответственного", только замену на
        другую assignable позицию той же организации. expectedVersion
        обязателен (conventions.md разд.5).
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignDealRequest'
      responses:
        '200':
          description: Сделка переназначена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет client.reassign
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — сделка или новый ownerPositionId (Position) не найдены/вне tenant
          $ref: '#/components/responses/Error'
        '409':
          description: >
            Position closed (ConflictException — переиспользует OrganizationsService.findAssignablePosition)
            ИЛИ VERSION_CONFLICT — expectedVersion устарел
          $ref: '#/components/responses/Error'

  /deals/{dealId}/stage:
    patch:
      operationId: changeDealStage
      summary: >
        Смена стадии сделки с проверкой матрицы допустимых переходов и optimistic concurrency (expectedVersion).
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDealStageRequest'
      responses:
        '200':
          description: Стадия сделки изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED — недопустимый переход стадии
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.changeStage
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — сделка была изменена параллельным запросом
          $ref: '#/components/responses/Error'

  /deals/{dealId}/participants:
    post:
      operationId: addDealParticipant
      summary: Добавление участника сделки с optimistic concurrency
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDealParticipantRequest'
      responses:
        '200':
          description: Участник добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.edit
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — сделка или контакт участника не найден
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT или DUPLICATE_DETECTED — сделка изменилась параллельно либо контакт уже является участником
          $ref: '#/components/responses/Error'

  /deals/{dealId}/participants/{contactId}:
    delete:
      operationId: removeDealParticipant
      summary: Удаление участника из сделки с optimistic concurrency
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
        - name: contactId
          in: path
          required: true
          schema: {type: string}
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Участник удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.edit
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — участник или сделка не найдены
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — сделка была изменена параллельным запросом
          $ref: '#/components/responses/Error'

  /deals/{dealId}/checklist:
    patch:
      operationId: updateDealChecklist
      summary: Атомарное обновление чек-листа сделки с optimistic concurrency
      tags: [erp-crm]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDealChecklistRequest'
      responses:
        '200':
          description: Чек-лист обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealView'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет deal.edit
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: VERSION_CONFLICT — сделка была изменена параллельным запросом
          $ref: '#/components/responses/Error'

  /admin/duplicate-candidates:
    get:
      operationId: adminListDuplicateCandidates
      summary: >
        Admin review queue для DEDUPE-001 (master plan разд.2.3: "Автор может
        заявить, что это не дубль; такое исключение логируется и попадает в
        административную проверку"). duplicate_candidate.read — global scope
        (пара может involve organizations из разных городов, city-scoping
        здесь структурно не подходит, в отличие от publications).
        Отсутствие гранта — ошибка (403), НЕ пустой список (в отличие от
        adminListPublications, где отсутствие read-scope даёт пустой
        результат) — здесь единственный grant либо есть, либо нет, нет
        частичного scope, который стоило бы молча сужать до пустоты.
      tags: [admin]
      parameters:
        - name: status
          in: query
          description: "Без значения — очередь на проверку (detected + override_not_duplicate)"
          schema: {type: string, enum: [detected, override_not_duplicate, confirmed_duplicate]}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список кандидатов с денормализованной парой PropertyAsset для визуального сравнения
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminDuplicateCandidate'
                  nextCursor: {type: string, nullable: true}
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '403':
          description: ADMIN_SCOPE_INSUFFICIENT — нет duplicate_candidate.read
          $ref: '#/components/responses/Error'

  /admin/duplicate-candidates/{duplicateCandidateId}/confirm:
    post:
      operationId: adminConfirmDuplicateCandidate
      summary: >
        Admin critical action: подтверждает, что пара — реальный дубль.
        Единственный actor, кто может confirm ИЗ override_not_duplicate
        (отменяет решение владельца "не дубль"), не только ИЗ detected.
        reason обязателен (permission-matrix.md разд.4).
      tags: [admin]
      parameters:
        - name: duplicateCandidateId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        '200':
          description: Кандидат переведён в confirmed_duplicate
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  status: {type: string, enum: [confirmed_duplicate]}
        '400':
          description: ADMIN_REASON_REQUIRED — reason короче 10 символов
          $ref: '#/components/responses/Error'
        '403':
          description: ADMIN_SCOPE_INSUFFICIENT — нет duplicate_candidate.confirm
          $ref: '#/components/responses/Error'
        '404':
          description: Duplicate candidate не найден
          $ref: '#/components/responses/Error'
        '409':
          description: Уже confirmed_duplicate
          $ref: '#/components/responses/Error'

  /admin/publications:
    get:
      operationId: adminListPublications
      summary: >
        Admin находит publication только в разрешённом scope (мастер-план D-06)
        — deny-by-default: sourceType/city read-grant'ы admin'а определяют,
        что видно, sourceType/city query-параметры дополнительно СУЖАЮТ уже
        разрешённый набор, не расширяют его
      tags: [admin]
      parameters:
        - name: sourceType
          in: query
          schema: {type: string, enum: [development, unit, listing]}
        - name: city
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >
            Список publication в разрешённом scope, ЛЮБОЙ статус (не только
            published — admin должен видеть publication_pending/unpublished/
            build_failed тоже)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        sourceType: {type: string}
                        sourceId: {type: string}
                        organizationId: {type: string, nullable: true}
                        status: {type: string}
                        slug: {type: string, nullable: true}
                        publishedAt: {type: string, nullable: true}
                        unpublishedAt: {type: string, nullable: true}
                        unpublishReason: {type: string, nullable: true}
                        city: {type: string, nullable: true}
                  nextCursor: {type: string, nullable: true}
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'

  /admin/publications/{publicationId}/unpublish:
    post:
      operationId: adminUnpublish
      summary: >
        Admin снимает публикацию с публичного каталога — синхронная транзакция
        (ADR-005 патч), обязательный reason (permission-matrix.md разд.4)
      tags: [admin]
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        '200':
          description: >
            Публикация скрыта немедленно (синхронно), canonical-статус изменён,
            audit event записан в той же транзакции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '400':
          description: ADMIN_REASON_REQUIRED
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN / ADMIN_SCOPE_INSUFFICIENT
          $ref: '#/components/responses/Error'

  /admin/me:
    get:
      operationId: adminMe
      summary: Получение профиля текущего администратора и его скоупа прав
      tags: [admin]
      responses:
