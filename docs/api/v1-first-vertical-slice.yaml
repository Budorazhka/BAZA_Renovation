      responses:
        '201':
          description: Аккаунт администратора создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdminAccountResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN
          $ref: '#/components/responses/Error'
        '409':
