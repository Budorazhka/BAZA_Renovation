            POST /tasks/{taskId}/complete — он пишет completedAt,
            completedByPositionId и событие TaskCompleted.
          enum: [open, in_progress, cancelled]
        subtasks:
          type: array
          maxItems: 50
          description: >
            Полный список подзадач; заменяет прежний целиком, а не сливается
            с ним.
          items:
            type: object
            required: [id, title]
            properties:
              id: {type: string, maxLength: 120}
              title: {type: string, maxLength: 255}
              done: {type: boolean}

    ReassignTaskRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        assignedPositionId: {type: string, nullable: true, description: "Отсутствие/null — снять назначение (задача становится unassigned)."}

    CompleteTaskRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 0}

    TimelineEventItem:
      type: object
      required: [id, type, happenedAt, title, actor]
      properties:
        id: {type: string}
        type:
          type: string
          enum: [lead_stage_changed, lead_assigned, task_created, task_updated, task_completed, task_cancelled, audit_event]
        happenedAt: {type: string, format: date-time}
        title: {type: string}
        summary: {type: string, nullable: true}
        actor:
          type: object
          required: [type]
          properties:
            type: {type: string, enum: [position, identity, system, admin_account]}
            id: {type: string, nullable: true}
        metadata:
          type: object
          nullable: true
          additionalProperties: true

    TimelineResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEventItem'
        nextCursor: {type: string, nullable: true}

    DealStage:
      type: string
      enum: [showing, deposit, deal, golden, check_in, referral, closed_lost]

    CrmContactEmbed:
      type: object
      required: [id, name, phone]
      properties:
        id: {type: string}
        name: {type: string}
        phone: {type: string}
        email: {type: string, nullable: true}

    DealParticipant:
      type: object
      required: [role, contactId]
      properties:
        role: {type: string}
        contactId: {type: string}
        contact:
          $ref: '#/components/schemas/CrmContactEmbed'

    DealChecklistItem:
      type: object
      required: [id, label, done]
      properties:
        id: {type: string}
        label: {type: string}
        done: {type: boolean}
        completedAt: {type: string, format: date-time, nullable: true}
        completedByPositionId: {type: string, nullable: true}

    DealView:
      type: object
      required: [id, organizationId, contactId, ownerPositionId, title, stage, participants, checklistItems, version, createdAt, updatedAt]
      properties:
        id: {type: string}
        organizationId: {type: string}
        leadId: {type: string, nullable: true}
        contactId: {type: string}
        ownerPositionId: {type: string}
        title: {type: string}
        description: {type: string, nullable: true}
        stage:
          $ref: '#/components/schemas/DealStage'
        expectedCommission:
          $ref: '#/components/schemas/MoneyAmount'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/DealParticipant'
        checklistItems:
          type: array
          items:
            $ref: '#/components/schemas/DealChecklistItem'
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        contact:
          $ref: '#/components/schemas/CrmContactEmbed'

    DealListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DealView'
        nextCursor: {type: string, nullable: true}

    CreateDealRequest:
      type: object
      required: [contactId, title]
      properties:
        contactId: {type: string}
        ownerPositionId: {type: string}
        leadId: {type: string}
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 2000}
        stage:
          $ref: '#/components/schemas/DealStage'
        expectedCommission:
          $ref: '#/components/schemas/MoneyAmount'
        participants:
          type: array
          items:
            type: object
            required: [role, contactId]
            properties:
              role: {type: string, minLength: 1, maxLength: 50}
              contactId: {type: string}
        checklistItems:
          type: array
          items:
            type: object
            required: [label]
            properties:
              id: {type: string}
              label: {type: string, minLength: 1, maxLength: 500}
              done: {type: boolean}

    UpdateDealRequest:
      type: object
      description: "НЕ содержит ownerPositionId — см. PATCH /deals/{dealId}/reassign."
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 2000, nullable: true}
        expectedCommission:
          $ref: '#/components/schemas/MoneyAmount'

    ReassignDealRequest:
      type: object
      required: [expectedVersion, ownerPositionId]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        ownerPositionId: {type: string, description: "Обязательное поле — у Deal, в отличие от Task, нет 'unassigned' состояния."}

    ChangeDealStageRequest:
      type: object
      required: [stage, expectedVersion]
      properties:
        stage:
          $ref: '#/components/schemas/DealStage'
        expectedVersion: {type: integer, minimum: 0}
        reason: {type: string, maxLength: 2000}

    AddDealParticipantRequest:
      type: object
      required: [contactId, role, expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        contactId: {type: string}
        role: {type: string, minLength: 1, maxLength: 50}

    DealChecklistItemInput:
      type: object
      required: [label, done]
      properties:
        id: {type: string}
        label: {type: string, minLength: 1, maxLength: 500}
        done: {type: boolean}

    UpdateDealChecklistRequest:
      type: object
      required: [items, expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        items:
          type: array
          items:
            $ref: '#/components/schemas/DealChecklistItemInput'

    ErpMePermission:
      type: object
      required: [resource, action, scope]
      properties:
        resource: {type: string}
        action: {type: string}
        scope: {type: string, enum: [own, position, team, organization, global, city, domain, project, assigned]}
        scopeValue: {type: string}

    ErpMeResponse:
      type: object
      required: [identity, organization, position, permissions]
      properties:
        identity:
          type: object
          required: [id, login, status]
          properties:
            id: {type: string}
            login: {type: string}
            status: {type: string}
        organization:
          type: object
          required: [id, name, type, status]
          properties:
            id: {type: string}
            name: {type: string}
            type: {type: string, enum: [agency, developer, realtor]}
            status: {type: string}
        position:
          type: object
          required: [id, role, displayName]
          properties:
            id: {type: string}
            role: {type: string, enum: [owner, director, rop, manager, administrator, marketer, developer]}
            displayName: {type: string}
            parentPositionId: {type: string, nullable: true}
            avatarUrl: {type: string}
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ErpMePermission'

