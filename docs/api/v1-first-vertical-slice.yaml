openapi: 3.0.3
info:
  title: BAZA.sale API — v1 first vertical slice
  version: 0.1.0-proposed
  description: >
    Первый OpenAPI-срез, покрывающий ровно цепочку D-07 (vertical E2E acceptance,
    CLAUDE_HANDOFF_TZ.md разд.9): застройщик создаёт draft ЖК → корпус → этаж →
    юнит → публикует → гость находит через поиск/карту → открывает карточку →
    раскрывает контакт → лид появляется в ERP организации застройщика →
    РОП назначает лид на менеджера → Admin снимает публикацию с причиной →
    marketplace больше не выдаёт карточку, ERP видит причину, audit полон.
    Статус: Proposed, первый цельный проход 25.08.2026. Не production-контракт,
    основа для дальнейшего развития по мере проектирования остальных вертикалей.

servers:
  - url: /api/v1

security:
  - cookieAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: Логин (audience определяется origin запроса, ADR-004)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: Успешный логин, session cookie установлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  identityId: {type: string}
                  requires2fa: {type: boolean}
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /auth/register:
    post:
      operationId: register
      summary: >
        Регистрация Identity (domain-model.md Module 1 command `register`) —
        расширение узкой D-07 spec, тот же паттерн, что unit.price.update/
        status.update в D-01: не в исходной D-07 vertical slice, но без
        этой команды ни одна Identity не может появиться в системе.
        Не создаёт ERP/Admin ProductAccess сама по себе — только базовую
        marketplace-способную Identity (ADR-004).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: {type: string}
                password: {type: string, format: password, minLength: 8}
      responses:
        '201':
          description: Identity создана (без сессии — отдельный /auth/login вызов после)
          content:
            application/json:
              schema:
                type: object
                properties:
                  identityId: {type: string}
        '409':
          description: normalizedLogin уже занят (domain-model.md invariant — уникален глобально)
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход — очищает cookie и инвалидирует серверную сессию.
      security: []
      responses:
        '200':
          description: Сессия успешно завершена
          content:
            application/json:
              schema:
                type: object
                required: [loggedOut]
                properties:
                  loggedOut: { type: boolean }

  /auth/session:
    get:
      operationId: checkSession
      tags: [auth]
      summary: Проверка текущей сессии без побочных эффектов.
      description: >
        Audience определяется сервером по Origin. Отсутствующая, просроченная,
        отозванная или выданная для другого продукта cookie намеренно не
        различаются и возвращают authenticated=false.
      security: []
      responses:
        '200':
          description: Состояние сессии.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: { type: boolean }
        '401':
          description: Origin отсутствует или не относится к известному продукту.
          $ref: '#/components/responses/Error'

  /me:
    get:
      operationId: getErpMe
      summary: Канонический контекст текущего пользователя ERP (Identity, Organization, Position, Permissions)
      description: >
        Audience и TenantContext определяются сервером исключительно по baza_session cookie.
        Возвращает агрегированный профиль identity, organization, position и список эффективных
        прав (grants).
      tags: [erp-context]
      responses:
        '200':
          description: Текущий контекст пользователя ERP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpMeResponse'
        '401':
          description: AUTH_NO_SESSION — нет session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет активного tenant context (сессия не erp или нет активной позиции)
          $ref: '#/components/responses/Error'

  /exports/{entity}:
    get:
      operationId: runExport
      summary: >
        Выгрузка CRM-списка в XLSX (export.run). Сущность — одна из
        leads/deals/contacts/tasks.

        ВАЖНО: сам грант export.run НЕ даёт доступа к данным. Дополнительно
        требуется право на чтение конкретной сущности (lead.read, deal.read,
        contact.read, task.read) и применяется то же сужение по scope, что и
        у соответствующего list-эндпоинта: own-grant выгружает только своё.
        Иначе выгрузка стала бы обходом прав на чтение — сразу файлом и
        целиком. Например, `administrator` имеет export.run, но не имеет
        deal.read, и получает 403 на /exports/deals.

        Выгрузка ограничена 10 000 строками: превышение отклоняется целиком,
        файл не обрезается молча.
      tags: [erp-crm]
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [leads, deals, contacts, tasks]
      responses:
        '200':
          description: XLSX-файл выгрузки (Content-Disposition attachment, имя файла в filename* RFC 5987)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: VALIDATION_FAILED — неизвестная сущность ИЛИ превышен потолок в 10 000 строк
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет export.run ЛИБО нет права на чтение этой сущности
          $ref: '#/components/responses/Error'

  /organizations/register:
    post:
      operationId: registerOrganization
      summary: Регистрация новой организации и создание роли первого владельца (onboarding)
      tags: [organizations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrganizationRequest'
      responses:
        '201':
          description: Организация создана, сессия установлена в cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterOrganizationResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: UNAUTHORIZED — неверный логин или пароль Identity
          $ref: '#/components/responses/Error'
        '409':
          description: CONFLICT — у Identity уже есть организация или имя занято
          $ref: '#/components/responses/Error'

  /developments:
    post:
      operationId: createDevelopment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: Создать draft ЖК (застройщик)
      tags: [erp-development]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDevelopmentRequest'
      responses:
        '201':
          description: Development создан в статусе draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Development'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    get:
      operationId: listDevelopments
      summary: Список ЖК текущей организации (cursor pagination)
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список ЖК
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentList'

  /developments/{developmentId}:
    get:
      operationId: getDevelopment
      summary: Получить ЖК по id (tenant-scoped)
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/DevelopmentId'
      responses:
        '200':
          description: Development
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Development'
        '404':
          $ref: '#/components/responses/Error'

  /developments/{developmentId}/chessboard/export:
    get:
      operationId: exportChessboard
      summary: >
        Выгрузка шахматки ЖК в XLSX (chessboard.export). ЕДИНСТВЕННЫЙ
        эндпоинт API, отдающий не JSON, а бинарное тело файла.
        Формат воспроизводит выгрузку bz26-client-erp (владелец, 31.08.2026):
        лист «Шахматка», 15 колонок, русские подписи статусов, без стилей и
        итоговых строк. Пять колонок цен по кондициям и «Базовая цена за м²»
        всегда пустые — таких полей в доменной модели BAZA нет, колонки
        сохранены ради совместимости формы файла.
        Выгружаются ВСЕ корпуса ЖК одним файлом (корпус — первая колонка) и
        ТОЛЬКО kind=apartment. Строки отсортированы корпус → этаж → номер.
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/DevelopmentId'
      responses:
        '200':
          description: XLSX-файл шахматки (Content-Disposition attachment, имя файла в filename* RFC 5987)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: >
            VALIDATION_FAILED — в ЖК смешаны разные валюты (единый заголовок
            колонок соврал бы про часть строк) ИЛИ число квартир превышает
            потолок выгрузки
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет chessboard.export
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — ЖК не существует/чужой (единый non-disclosure код)
          $ref: '#/components/responses/Error'

  /developments/{developmentId}/buildings:
    post:
      operationId: createBuilding
      summary: Создать корпус внутри ЖК
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/DevelopmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuildingRequest'
      responses:
        '201':
          description: Building создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'

  /buildings/{buildingId}/floors:
    post:
      operationId: createFloor
      summary: Создать этаж внутри корпуса
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: buildingId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFloorRequest'
      responses:
        '201':
          description: Floor создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Floor'

  /floors/{floorId}/units:
    post:
      operationId: createUnit
      summary: Создать юнит на этаже (включая kind=parking для отдельной паркинг-шахматки)
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: floorId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUnitRequest'
      responses:
        '201':
          description: Unit создан в статусе available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'

  /developments/{developmentId}/publish:
    post:
      operationId: publishDevelopment
      summary: Публикация ЖК (draft → active, синхронная транзакция + асинхронная projection, ADR-005)
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/DevelopmentId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: >
            Publication принята, статус publication_pending (ADR-005 патч — worker
            строит полную проекцию асинхронно, этот ответ не ждёт его завершения)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '400':
          description: PUBLICATION_SOURCE_NOT_READY
          $ref: '#/components/responses/Error'
        '409':
          description: IDEMPOTENCY_KEY_CONFLICT
          $ref: '#/components/responses/Error'

  /bookings:
    post:
      operationId: createBooking
      summary: Создать атомарную бронь юнита (BOOK-001, ADR-006)
      description: >
        Бронь создаётся только внутри MongoDB-транзакции. BookingLock
        сериализует операции на одном unitId, поэтому две пересекающиеся
        активные брони не могут быть зафиксированы одновременно. Повтор с
        тем же Idempotency-Key возвращает сохранённый ответ.
      tags: [erp-bookings]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Бронь создана в статусе pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Некорректный диапазон дат или отсутствует Idempotency-Key
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Unit или lead не найдены в текущей организации
          $ref: '#/components/responses/Error'
        '409':
          description: Пересечение активной брони или конфликт Idempotency-Key
          $ref: '#/components/responses/Error'

  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      summary: >
        Отменить бронь (BOOK-001 follow-up) — booking.cancel.organization,
        не booking.create.own: отменить может руководитель, не только автор
        брони. Разрешено только из pending/booked; paid (уже оплачена) и
        уже терминальные (rejected/expired) отклоняются как
        BOOKING_INVALID_STATE_TRANSITION — оплаченная бронь требует
        отдельного финансового процесса, вне этого среза.
      tags: [erp-bookings]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, nullable: true}
      responses:
        '200':
          description: Бронь переведена в статус rejected, unit свободен для новых броней
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Отсутствует Idempotency-Key
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Booking не существует/чужая организация (non-disclosure)
          $ref: '#/components/responses/Error'
        '409':
          description: Booking не в pending/booked (уже rejected/expired/paid) или конфликт Idempotency-Key
          $ref: '#/components/responses/Error'

  /bookings/{bookingId}/confirm:
    post:
      operationId: confirmBooking
      summary: >
        Подтвердить бронь (BOOK-001 follow-up) — booking.confirm.own, единственное
        действие из триптиха confirm/cancel/extend, доступное manager'у для
        СВОЕЙ брони (cancel/extend требуют organization grant). pending → booked.
      tags: [erp-bookings]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Бронь переведена в статус booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Отсутствует Idempotency-Key
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Booking не существует/чужая организация/не own (non-disclosure)
          $ref: '#/components/responses/Error'
        '409':
          description: Booking не в pending (уже booked/rejected/expired/paid) или конфликт Idempotency-Key
          $ref: '#/components/responses/Error'

  /bookings/{bookingId}/extend:
    post:
      operationId: extendBooking
      summary: >
        Продлить бронь (BOOK-001 follow-up) — booking.extend.organization
        (не .own, как cancel). Только вперёд: newExpiresAt строго позже
        текущего expiresAt. Проверяется на пересечение с другими активными
        бронями того же unit (исключая саму себя).
      tags: [erp-bookings]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newExpiresAt]
              properties:
                newExpiresAt: {type: string, format: date-time}
      responses:
        '200':
          description: Бронь продлена, dateRange.expiresAt обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Отсутствует Idempotency-Key или newExpiresAt не позже текущего expiresAt
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Booking не существует/чужая организация (non-disclosure)
          $ref: '#/components/responses/Error'
        '409':
          description: Пересечение активной брони, Booking не в pending/booked, или конфликт Idempotency-Key
          $ref: '#/components/responses/Error'

  /public/developments:
    get:
      operationId: searchPublicDevelopments
      summary: Публичный поиск ЖК (гость, каталог/карта, MongoDB geo/compound индексы ADR-007)
      tags: [public-marketplace]
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: bbox
          in: query
          description: "bounding box для поиска по области карты: minLng,minLat,maxLng,maxLat"
          schema: {type: string}
        - name: city
          in: query
          schema: {type: string}
        - name: sort
          in: query
          description: "Порядок выдачи. Для ЖК поддерживается только newest."
          schema: {type: string, enum: [newest], default: newest}
      responses:
        '200':
          description: Список публичных карточек (whitelist-поля из MarketplacePublication, ADR-005)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDevelopmentList'
        '400':
          description: VALIDATION_FAILED — невалидный cursor/limit/bbox или неизвестный query-параметр (D-04A)
          $ref: '#/components/responses/Error'

  /public/developments/{slug}:
    get:
      operationId: getPublicDevelopment
      summary: Публичная карточка ЖК по slug (SSR, только status=published)
      tags: [public-marketplace]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Публичная карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDevelopmentCard'
        '404':
          description: PUBLICATION_NOT_FOUND
          $ref: '#/components/responses/Error'

  /public/developments/{slug}/reveal-contact:
    post:
      operationId: revealContact
      summary: >
        Раскрытие контакта — отдельная rate-limited команда, создаёт Lead
        (master plan D-05: контакты отсутствуют в list/search HTML/JSON,
        reveal отдельная команда с audit/abuse signals)
      tags: [public-marketplace]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKeyHeaderOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealContactRequest'
      responses:
        '200':
          description: Контакт раскрыт, Lead создан в организации застройщика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealContactResponse'
        '409':
          description: IDEMPOTENCY_KEY_CONFLICT — тот же Idempotency-Key уже использован с другим телом запроса
          $ref: '#/components/responses/Error'
        '429':
          description: RATE_LIMITED
          $ref: '#/components/responses/Error'

  /leads/{leadId}/assign:
    post:
      operationId: assignLead
      summary: РОП/Директор/Собственник назначает лид на Position менеджера (ручное назначение, не auto)
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneePositionId]
              properties:
                assigneePositionId: {type: string}
      responses:
        '200':
          description: Лид назначен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '403':
          description: FORBIDDEN — нет lead.assign.organization
          $ref: '#/components/responses/Error'

  /leads:
    post:
      operationId: createLead
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: >
        Ручное создание лида в CRM (lead.create.organization) — security review
        31.08.2026: грант был выдан всем ролям, но до этого прохода не
        существовало ни одного HTTP-пути завести лид вручную (единственный
        источник — публичный reveal-contact). Ровно один способ указать
        контакт: contactId (уже существующий) либо requesterPhone
        (find-or-create по телефону в этой организации, тот же tenant-local
        dedupe, что reveal-contact). ownerPositionId НЕ проставляется
        автоматически на создателя — лид стартует unassigned, как и лиды с
        сайта; назначение — отдельный вызов POST /leads/{leadId}/assign
        (owner decision: "Автоматическая раздача... не является стартовым
        поведением").
      tags: [erp-crm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactId: {type: string}
                requesterName: {type: string}
                requesterPhone: {type: string}
      responses:
        '201':
          description: Лид создан, stage=new, ownerPositionId=null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListItem'
        '400':
          description: VALIDATION_FAILED — ни contactId, ни requesterPhone не переданы
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.create
          $ref: '#/components/responses/Error'
        '404':
          description: contactId указывает на несуществующий/чужой контакт
          $ref: '#/components/responses/Error'
    get:
      operationId: listLeads
      summary: >
        Список лидов текущей организации, newest-first, cursor-paginated.
        organization-scope (owner/director/rop/administrator) видит весь
        tenant; own-scope (manager) видит только лиды, где ownerPositionId
        совпадает с его собственной Position — сужение применяется на
        backend до чтения, не постфильтрацией. ownerPositionId в query —
        дополнительное клиентское сужение поверх уже резолвленного scope,
        никогда не расширяет его (own-scope с чужим ownerPositionId в query
        — 400, не 403 и не расширение видимости).
      tags: [erp-crm]
      parameters:
        - name: stage
          in: query
          schema: {type: string, enum: [new, contacted, qualified, converted, lost]}
        - name: ownerPositionId
          in: query
          schema: {type: string}
        - name: stalled
          in: query
          schema: {type: boolean}
          description: Фильтр по признаку stalled (активный лид без открытых задач)
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Лиды текущего tenant/scope, newest-first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
        '400':
          description: VALIDATION_FAILED — невалидный stage/ownerPositionId/cursor/limit, либо ownerPositionId вне permission scope вызывающего
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION — нет baza_session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.read
          $ref: '#/components/responses/Error'

  /leads/{leadId}/events:
    get:
      operationId: listLeadEvents
      summary: >
        Append-only история stage-переходов ОДНОГО лида, newest-first,
        cursor-paginated. Tenant и owner/own-scope проверяются ДО чтения
        lead_events (тот же findByIdForOrganization, что GET /leads/{leadId})
        — чужой (другая организация, либо не «свой» лид при own-scope) и
