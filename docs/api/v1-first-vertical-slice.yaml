        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /marketplace/property-assets/{assetId}/listings:
    post:
      operationId: marketplaceCreateListing
      description: >-
        Зеркало ERP-операции: та же предметная область и те же схемы, но граница авторизации другая — MarketplaceAccountGuard и совпадение identityId в publisherScope с сессией вместо PermissionGrant-матрицы организации.
      summary: Создать Listing для PropertyAsset
      tags: [marketplace-property-assets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Listing создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: marketplaceListListings
      description: >-
        Зеркало ERP-операции: та же предметная область и те же схемы, но граница авторизации другая — MarketplaceAccountGuard и совпадение identityId в publisherScope с сессией вместо PermissionGrant-матрицы организации.
      summary: Список Listing для PropertyAsset
      tags: [marketplace-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Список Listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /marketplace/property-assets/{assetId}/listings/{listingId}/activate:
    patch:
      operationId: marketplaceActivateListing
      description: >-
        Зеркало ERP-операции: та же предметная область и те же схемы, но граница авторизации другая — MarketplaceAccountGuard и совпадение identityId в publisherScope с сессией вместо PermissionGrant-матрицы организации.
      summary: Активировать Listing (draft -> active)
      tags: [marketplace-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Listing активирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Уже есть активный listing для этого dealType или статус не draft
          $ref: '#/components/responses/Error'

  /marketplace/property-assets/{assetId}/listings/{listingId}/actuality:
    get:
      operationId: marketplaceGetListingActuality
      description: >-
        Зеркало ERP-операции: та же предметная область и те же схемы, но граница авторизации другая — MarketplaceAccountGuard и совпадение identityId в publisherScope с сессией вместо PermissionGrant-матрицы организации.
      summary: Получить состояние актуальности Listing
      tags: [marketplace-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Состояние актуальности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingActuality'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /marketplace/property-assets/{assetId}/listings/{listingId}/confirm-actuality:
    patch:
      operationId: marketplaceConfirmListingActuality
      description: >-
        Зеркало ERP-операции: та же предметная область и те же схемы, но граница авторизации другая — MarketplaceAccountGuard и совпадение identityId в publisherScope с сессией вместо PermissionGrant-матрицы организации.
      summary: Подтвердить актуальность Listing (сброс таймера)
      tags: [marketplace-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: {type: integer, minimum: 0}
      responses:
        '200':
          description: Актуальность подтверждена, возвращает обновлённое состояние актуальности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingActuality'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Version conflict / Listing is not active or expired
          $ref: '#/components/responses/Error'

  /marketplace/property-assets/{assetId}/duplicate-candidates:
    get:
      operationId: marketplaceGetDuplicateCandidates
      description: >-
        Зеркало ERP-операции: та же предметная область и те же схемы, но граница авторизации другая — MarketplaceAccountGuard и совпадение identityId в publisherScope с сессией вместо PermissionGrant-матрицы организации.
      summary: Получить список кандидатов-дублей для PropertyAsset
      tags: [marketplace-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Список кандидатов-дублей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DuplicateCandidate'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /marketplace/property-assets/duplicate-candidates/{duplicateCandidateId}/override:
    post:
      operationId: marketplaceOverrideDuplicateCandidate
      description: >-
        Зеркало ERP-операции: та же предметная область и те же схемы, но граница авторизации другая — MarketplaceAccountGuard и совпадение identityId в publisherScope с сессией вместо PermissionGrant-матрицы организации.
      summary: Owner override дубль-блокировки (подтверждение «это не дубль»)
      tags: [marketplace-property-assets]
      parameters:
        - name: duplicateCandidateId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        '200':
          description: Дубль снят (status override_not_duplicate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  status: {type: string, enum: [override_not_duplicate]}
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Duplicate candidate status is not 'detected'
          $ref: '#/components/responses/Error'

  /marketplace/property-assets/{assetId}/listings/{listingId}/publish:
    post:
      operationId: marketplacePublishListing
      description: >-
        Зеркало ERP-операции: та же предметная область и те же схемы, но граница авторизации другая — MarketplaceAccountGuard и совпадение identityId в publisherScope с сессией вместо PermissionGrant-матрицы организации.
      summary: >
        MKT-002: публикация Listing (active → publication_pending, синхронная
        транзакция + асинхронная projection, ADR-005) — тот же паттерн, что
        publishDevelopment. Listing.status не меняется этой командой (в
        отличие от Development draft→active); повторный publish уже
        published/publication_pending listing отклоняется 409 (не создаёт
        дублирующую publication/version) — используйте unpublish, затем
        publish заново.
      tags: [marketplace-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Publication принята, статус publication_pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '404':
          description: Listing не найден / чужая организация (единый non-disclosure код)
          $ref: '#/components/responses/Error'
        '409':
          description: >
            Listing status не 'active' (draft/expired/archived) ИЛИ публикация
            уже существует в статусе, отличном от unpublished/build_failed
          $ref: '#/components/responses/Error'

  /marketplace/property-assets/{assetId}/listings/{listingId}/unpublish:
    post:
      operationId: marketplaceUnpublishListing
      description: >-
        Зеркало ERP-операции: та же предметная область и те же схемы, но граница авторизации другая — MarketplaceAccountGuard и совпадение identityId в publisherScope с сессией вместо PermissionGrant-матрицы организации.
      summary: >
        MKT-002: owner снимает Listing с публичного каталога — синхронная
        транзакция (тот же PublicationService.unpublish, что D-06 admin
        unpublish использует, actorType:identity вместо admin_account)
      tags: [marketplace-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        '201':
          description: >
            Публикация скрыта немедленно (синхронно) — 201, не 200 (Nest
            default для POST без явного @HttpCode, задокументировано как
            фактическое поведение, не переопределено этим проходом)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Publication уже не в статусе published
          $ref: '#/components/responses/Error'

  /marketplace/property-assets/{assetId}/listings/{listingId}/publication-status:
    get:
      operationId: marketplaceGetListingPublicationStatus
      description: >-
        Зеркало ERP-операции: та же предметная область и те же схемы, но граница авторизации другая — MarketplaceAccountGuard и совпадение identityId в publisherScope с сессией вместо PermissionGrant-матрицы организации.
      summary: >
        ERP polling после publish — читает РЕАЛЬНЫЙ статус MarketplacePublication,
        не canonical Listing.status (тот же паттерн, что D-03
        getPublicationStatus для Development)
      tags: [marketplace-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Publication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '404':
          description: Listing не существует/чужой ИЛИ публикация никогда не запускалась (единый non-disclosure код)
          $ref: '#/components/responses/Error'

  /public/listings:
    get:
      operationId: searchPublicListings
      summary: >
        MKT-002: публичный поиск вторички/аренды (гость, каталог/карта) —
        тот же паттерн, что searchPublicDevelopments, дополнительно
        фильтруется по dealType/propertyType/commercialSubtype
      tags: [public-marketplace]
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: bbox
          in: query
          description: "bounding box для поиска по области карты: minLng,minLat,maxLng,maxLat"
          schema: {type: string}
        - name: city
          in: query
          schema: {type: string}
        - name: dealType
          in: query
          schema: {type: string, enum: [sale, rent_long, rent_short]}
        - name: propertyType
          in: query
          schema: {type: string, enum: [apartment, house, land, commercial]}
        - name: commercialSubtype
          in: query
          schema: {type: string, enum: [office, warehouse, retail, business, free_purpose]}
        - name: sort
          in: query
          description: "Порядок выдачи: newest, price_asc/desc или area_asc/desc."
          schema: {type: string, enum: [newest, price_asc, price_desc, area_asc, area_desc], default: newest}
      responses:
        '200':
          description: Список публичных карточек (whitelist-поля из MarketplacePublication, ADR-005)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicListingList'
        '400':
          description: VALIDATION_FAILED — невалидный cursor/limit/bbox/enum-значение или неизвестный query-параметр
          $ref: '#/components/responses/Error'

  /public/listings/{slug}:
    get:
      operationId: getPublicListing
      summary: >
        Публичная карточка Listing по slug (только status=published). Единый
        404 для "не существует" и "slug принадлежит Development/Unit, не
        Listing" (non-disclosure, тот же принцип, что getPublicDevelopment)
      tags: [public-marketplace]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Публичная карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicListingCard'
        '404':
          description: PUBLICATION_NOT_FOUND
          $ref: '#/components/responses/Error'

  /public/listings/{slug}/reveal-contact:
    post:
      operationId: revealListingContact
      summary: >
        Раскрытие контакта для листинга вторички/аренды — отдельная rate-limited
        команда, создаёт Lead и Contact в организации-владельце PropertyAsset
        (тот же паттерн, что /public/developments/{slug}/reveal-contact)
      tags: [public-marketplace]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKeyHeaderOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealContactRequest'
      responses:
        '200':
          description: Контакт раскрыт, Lead создан в организации-владельце листинга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealContactResponse'
        '400':
          description: VALIDATION_FAILED — requesterPhone обязателен для создания лида
          $ref: '#/components/responses/Error'
        '404':
          description: PUBLICATION_NOT_FOUND — публикация не найдена, не опубликована или не является листингом
          $ref: '#/components/responses/Error'
        '409':
          description: IDEMPOTENCY_KEY_CONFLICT — тот же Idempotency-Key уже использован с другим телом запроса
          $ref: '#/components/responses/Error'
        '429':
          description: RATE_LIMITED
          $ref: '#/components/responses/Error'


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: baza_session
      description: Host-only secure cookie, productAudience зашит в server-side session (ADR-004)

  parameters:
    Cursor:
      name: cursor
      in: query
      description: "Непрозрачный cursor из предыдущего ответа; для newest принимается legacy ObjectId."
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, default: 20, maximum: 100}
    DevelopmentId:
      name: developmentId
      in: path
      required: true
      schema: {type: string}
    AssetId:
      name: assetId
      in: path
      required: true
      schema: {type: string}
    MediaAssetId:
      name: mediaAssetId
      in: path
      required: true
      schema: {type: string}
    ListingId:
      name: listingId
      in: path
      required: true
      schema: {type: string}
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: {type: string}
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: >
        Обязателен на всех создающих и критических командах. ADR-006 называет
        publish/book/cancel/manual-ledger как примеры; фактический перечень
        шире и закреплён тестом
        apps/api/test/architecture/idempotency-coverage.test.ts —
        см. docs/api/conventions.md §8.
    IdempotencyKeyHeaderOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, format: uuid}
      description: >
        Опционален для reveal-contact (в отличие от ADR-006 publish/book/cancel) —
        повтор без ключа сохраняет текущую совместимость (всегда новый Lead).
        С ключом: повторный запрос с тем же (slug, ключ) и тем же телом возвращает
        сохранённый ответ, не создаёт новый Lead.

  responses:
    Error:
      description: Стандартный формат ошибки (conventions.md разд.3)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    MoneyAmount:
      type: object
      required: [amountMinorUnits, currency]
      properties:
        amountMinorUnits: {type: integer, description: "Никогда float (conventions.md разд.1)"}
        currency: {type: string, enum: [USD, GEL, RUB]}

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string, description: "См. error-catalog.md"}
            message: {type: string}
            requestId: {type: string, format: uuid}
            details: {type: object, additionalProperties: true}

    CreateDevelopmentRequest:
      type: object
      required: [name, location]
      properties:
        name: {type: string}
        location:
          type: object
          required: [country, city, geo]
          properties:
            country: {type: string}
            city: {type: string}
            address: {type: string}
            geo:
              type: object
              description: "GeoJSON Point, [longitude, latitude] — жёсткое требование порядка (ADR-007)"
              properties:
                type: {type: string, enum: [Point]}
                coordinates: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
        classType: {type: string}
        completionDate: {type: string, format: date}

    Development:
      type: object
      properties:
        id: {type: string}
        organizationId: {type: string}
        name: {type: string}
        status: {type: string, enum: [draft, active, archived]}
        location: {type: object}
        version: {type: integer, description: "Optimistic concurrency (conventions.md разд.5)"}
        createdAt: {type: string, format: date-time}

    DevelopmentList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Development'}}
        nextCursor: {type: string, nullable: true}

    CreateBuildingRequest:
      type: object
      required: [name, floorsCount]
      properties:
        name: {type: string}
        floorsCount: {type: integer}
        startDate: {type: string, format: date}
        completionDate: {type: string, format: date}

    Building:
      type: object
      properties:
        id: {type: string}
        developmentId: {type: string}
        organizationId: {type: string}
        name: {type: string}
        floorsCount: {type: integer}

    CreateFloorRequest:
      type: object
      required: [floorNumber]
      properties:
        floorNumber: {type: integer}
        sectionId: {type: string, nullable: true}
        floorType: {type: string, nullable: true}

    Floor:
      type: object
      properties:
        id: {type: string}
        buildingId: {type: string}
        organizationId: {type: string}
        floorNumber: {type: integer}

    CreateUnitRequest:
      type: object
      required: [number, kind, area, price]
      properties:
        number: {type: string}
        kind: {type: string, enum: [apartment, commercial, office, parking, storage, other], description: "parking — отдельная шахматка (domain-model.md Module 4)"}
        rooms: {type: integer, nullable: true}
        area: {type: number}
        price: {$ref: '#/components/schemas/MoneyAmount'}
        floorPlanId: {type: string, nullable: true}

    Unit:
      type: object
      properties:
        id: {type: string}
        floorId: {type: string}
        buildingId: {type: string}
        organizationId: {type: string}
        number: {type: string}
        kind: {type: string}
        area: {type: number}
        price: {$ref: '#/components/schemas/MoneyAmount'}
        status: {type: string, enum: [available, reserved, sold, hidden]}
        version: {type: integer}

    CreateBookingRequest:
      type: object
      required: [unitId, startsAt, expiresAt]
      properties:
        unitId: {type: string}
        leadId: {type: string, nullable: true}
        startsAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}

    Booking:
      type: object
      required: [id, unitId, organizationId, leadId, dateRange, status, manager, createdAt]
      properties:
        id: {type: string}
        unitId: {type: string}
        organizationId: {type: string}
        leadId: {type: string, nullable: true}
        dateRange:
          type: object
          required: [startsAt, expiresAt]
          properties:
            startsAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [pending, booked, rejected, expired, paid]}
        manager: {type: string, description: Position that owns the booking}
        createdAt: {type: string, format: date-time}

    PublicationStatus:
      type: object
      properties:
        id: {type: string}
        sourceType: {type: string, enum: [unit, development, listing]}
        sourceId: {type: string}
        status: {type: string, enum: [publication_pending, published, unpublished, build_failed]}
        slug: {type: string, nullable: true}
        unpublishReason: {type: string, nullable: true}

    AdminDuplicateCandidateAsset:
      type: object
      nullable: true
      description: null, если PropertyAsset больше не существует (удалён/несогласован)
      properties:
        id: {type: string}
        propertyType: {type: string, enum: [apartment, house, land, commercial]}
        location:
          type: object
          properties:
            city: {type: string}
            address: {type: string}
        characteristics:
          type: object
          properties:
            area: {type: number}
