openapi: 3.0.3
info:
  title: BAZA.sale API — v1 first vertical slice
  version: 0.1.0-proposed
  description: >
    Первый OpenAPI-срез, покрывающий ровно цепочку D-07 (vertical E2E acceptance,
    CLAUDE_HANDOFF_TZ.md разд.9): застройщик создаёт draft ЖК → корпус → этаж →
    юнит → публикует → гость находит через поиск/карту → открывает карточку →
    раскрывает контакт → лид появляется в ERP организации застройщика →
    РОП назначает лид на менеджера → Admin снимает публикацию с причиной →
    marketplace больше не выдаёт карточку, ERP видит причину, audit полон.
    Статус: Proposed, первый цельный проход 25.08.2026. Не production-контракт,
    основа для дальнейшего развития по мере проектирования остальных вертикалей.

servers:
  - url: /api/v1

security:
  - cookieAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: Логин (audience определяется origin запроса, ADR-004)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: Успешный логин, session cookie установлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  identityId: {type: string}
                  requires2fa: {type: boolean}
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /auth/register:
    post:
      operationId: register
      summary: >
        Регистрация Identity (domain-model.md Module 1 command `register`) —
        расширение узкой D-07 spec, тот же паттерн, что unit.price.update/
        status.update в D-01: не в исходной D-07 vertical slice, но без
        этой команды ни одна Identity не может появиться в системе.
        Не создаёт ERP/Admin ProductAccess сама по себе — только базовую
        marketplace-способную Identity (ADR-004).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: {type: string}
                password: {type: string, format: password, minLength: 8}
      responses:
        '201':
          description: Identity создана (без сессии — отдельный /auth/login вызов после)
          content:
            application/json:
              schema:
                type: object
                properties:
                  identityId: {type: string}
        '409':
          description: normalizedLogin уже занят (domain-model.md invariant — уникален глобально)
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход — очищает cookie и инвалидирует серверную сессию.
      security: []
      responses:
        '200':
          description: Сессия успешно завершена
          content:
            application/json:
              schema:
                type: object
                required: [loggedOut]
                properties:
                  loggedOut: { type: boolean }

  /auth/session:
    get:
      operationId: checkSession
      tags: [auth]
      summary: Проверка текущей сессии без побочных эффектов.
      description: >
        Audience определяется сервером по Origin. Отсутствующая, просроченная,
        отозванная или выданная для другого продукта cookie намеренно не
        различаются и возвращают authenticated=false.
      security: []
      responses:
        '200':
          description: Состояние сессии.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: { type: boolean }
        '401':
          description: Origin отсутствует или не относится к известному продукту.
          $ref: '#/components/responses/Error'

  /organizations/register:
    post:
      operationId: registerOrganization
      summary: Регистрация новой организации и создание роли первого владельца (onboarding)
      tags: [organizations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrganizationRequest'
      responses:
        '201':
          description: Организация создана, сессия установлена в cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterOrganizationResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '401':
          description: UNAUTHORIZED — неверный логин или пароль Identity
          $ref: '#/components/responses/Error'
        '409':
          description: CONFLICT — у Identity уже есть организация или имя занято
          $ref: '#/components/responses/Error'

  /developments:
    post:
      operationId: createDevelopment
      summary: Создать draft ЖК (застройщик)
      tags: [erp-development]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDevelopmentRequest'
      responses:
        '201':
          description: Development создан в статусе draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Development'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    get:
      operationId: listDevelopments
      summary: Список ЖК текущей организации (cursor pagination)
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список ЖК
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentList'

  /developments/{developmentId}:
    get:
      operationId: getDevelopment
      summary: Получить ЖК по id (tenant-scoped)
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/DevelopmentId'
      responses:
        '200':
          description: Development
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Development'
        '404':
          $ref: '#/components/responses/Error'

  /developments/{developmentId}/buildings:
    post:
      operationId: createBuilding
      summary: Создать корпус внутри ЖК
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/DevelopmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuildingRequest'
      responses:
        '201':
          description: Building создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'

  /buildings/{buildingId}/floors:
    post:
      operationId: createFloor
      summary: Создать этаж внутри корпуса
      tags: [erp-development]
      parameters:
        - name: buildingId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFloorRequest'
      responses:
        '201':
          description: Floor создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Floor'

  /floors/{floorId}/units:
    post:
      operationId: createUnit
      summary: Создать юнит на этаже (включая kind=parking для отдельной паркинг-шахматки)
      tags: [erp-development]
      parameters:
        - name: floorId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUnitRequest'
      responses:
        '201':
          description: Unit создан в статусе available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'

  /developments/{developmentId}/publish:
    post:
      operationId: publishDevelopment
      summary: Публикация ЖК (draft → active, синхронная транзакция + асинхронная projection, ADR-005)
      tags: [erp-development]
      parameters:
        - $ref: '#/components/parameters/DevelopmentId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: >
            Publication принята, статус publication_pending (ADR-005 патч — worker
            строит полную проекцию асинхронно, этот ответ не ждёт его завершения)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '400':
          description: PUBLICATION_SOURCE_NOT_READY
          $ref: '#/components/responses/Error'
        '409':
          description: IDEMPOTENCY_KEY_CONFLICT
          $ref: '#/components/responses/Error'

  /public/developments:
    get:
      operationId: searchPublicDevelopments
      summary: Публичный поиск ЖК (гость, каталог/карта, MongoDB geo/compound индексы ADR-007)
      tags: [public-marketplace]
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: bbox
          in: query
          description: "bounding box для поиска по области карты: minLng,minLat,maxLng,maxLat"
          schema: {type: string}
        - name: city
          in: query
          schema: {type: string}
        - name: sort
          in: query
          description: "Порядок выдачи. Для ЖК поддерживается только newest."
          schema: {type: string, enum: [newest], default: newest}
      responses:
        '200':
          description: Список публичных карточек (whitelist-поля из MarketplacePublication, ADR-005)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDevelopmentList'
        '400':
          description: VALIDATION_FAILED — невалидный cursor/limit/bbox или неизвестный query-параметр (D-04A)
          $ref: '#/components/responses/Error'

  /public/developments/{slug}:
    get:
      operationId: getPublicDevelopment
      summary: Публичная карточка ЖК по slug (SSR, только status=published)
      tags: [public-marketplace]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Публичная карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDevelopmentCard'
        '404':
          description: PUBLICATION_NOT_FOUND
          $ref: '#/components/responses/Error'

  /public/developments/{slug}/reveal-contact:
    post:
      operationId: revealContact
      summary: >
        Раскрытие контакта — отдельная rate-limited команда, создаёт Lead
        (master plan D-05: контакты отсутствуют в list/search HTML/JSON,
        reveal отдельная команда с audit/abuse signals)
      tags: [public-marketplace]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKeyHeaderOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealContactRequest'
      responses:
        '200':
          description: Контакт раскрыт, Lead создан в организации застройщика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealContactResponse'
        '409':
          description: IDEMPOTENCY_KEY_CONFLICT — тот же Idempotency-Key уже использован с другим телом запроса
          $ref: '#/components/responses/Error'
        '429':
          description: RATE_LIMITED
          $ref: '#/components/responses/Error'

  /leads/{leadId}/assign:
    post:
      operationId: assignLead
      summary: РОП/Директор/Собственник назначает лид на Position менеджера (ручное назначение, не auto)
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneePositionId]
              properties:
                assigneePositionId: {type: string}
      responses:
        '200':
          description: Лид назначен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '403':
          description: FORBIDDEN — нет lead.assign.organization
          $ref: '#/components/responses/Error'

  /leads:
    get:
      operationId: listLeads
      summary: >
        Список лидов текущей организации, newest-first, cursor-paginated.
        organization-scope (owner/director/rop/administrator) видит весь
        tenant; own-scope (manager) видит только лиды, где ownerPositionId
        совпадает с его собственной Position — сужение применяется на
        backend до чтения, не постфильтрацией. ownerPositionId в query —
        дополнительное клиентское сужение поверх уже резолвленного scope,
        никогда не расширяет его (own-scope с чужим ownerPositionId в query
        — 400, не 403 и не расширение видимости).
      tags: [erp-crm]
      parameters:
        - name: stage
          in: query
          schema: {type: string, enum: [new, contacted, qualified, converted, lost]}
        - name: ownerPositionId
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Лиды текущего tenant/scope, newest-first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
        '400':
          description: VALIDATION_FAILED — невалидный stage/ownerPositionId/cursor/limit, либо ownerPositionId вне permission scope вызывающего
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION — нет baza_session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.read
          $ref: '#/components/responses/Error'

  /leads/{leadId}/events:
    get:
      operationId: listLeadEvents
      summary: >
        Append-only история stage-переходов ОДНОГО лида, newest-first,
        cursor-paginated. Tenant и owner/own-scope проверяются ДО чтения
        lead_events (тот же findByIdForOrganization, что GET /leads/{leadId})
        — чужой (другая организация, либо не «свой» лид при own-scope) и
        несуществующий leadId дают ОДИНАКОВЫЙ 404 (non-disclosure).
      tags: [erp-crm]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: История переходов лида, newest-first (может быть пустой)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadEventListResponse'
        '400':
          description: VALIDATION_FAILED — невалидный leadId/cursor/limit
          $ref: '#/components/responses/Error'
        '401':
          description: AUTH_NO_SESSION — нет baza_session cookie
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN — нет lead.read
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND — лид не существует или вне permission scope (non-disclosure, тот же код для обоих случаев)
          $ref: '#/components/responses/Error'

  /admin/publications:
    get:
      operationId: adminListPublications
      summary: >
        Admin находит publication только в разрешённом scope (мастер-план D-06)
        — deny-by-default: sourceType/city read-grant'ы admin'а определяют,
        что видно, sourceType/city query-параметры дополнительно СУЖАЮТ уже
        разрешённый набор, не расширяют его
      tags: [admin]
      parameters:
        - name: sourceType
          in: query
          schema: {type: string, enum: [development, unit, listing]}
        - name: city
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >
            Список publication в разрешённом scope, ЛЮБОЙ статус (не только
            published — admin должен видеть publication_pending/unpublished/
            build_failed тоже)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        sourceType: {type: string}
                        sourceId: {type: string}
                        organizationId: {type: string, nullable: true}
                        status: {type: string}
                        slug: {type: string, nullable: true}
                        publishedAt: {type: string, nullable: true}
                        unpublishedAt: {type: string, nullable: true}
                        unpublishReason: {type: string, nullable: true}
                        city: {type: string, nullable: true}
                  nextCursor: {type: string, nullable: true}
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'

  /admin/publications/{publicationId}/unpublish:
    post:
      operationId: adminUnpublish
      summary: >
        Admin снимает публикацию с публичного каталога — синхронная транзакция
        (ADR-005 патч), обязательный reason (permission-matrix.md разд.4)
      tags: [admin]
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        '200':
          description: >
            Публикация скрыта немедленно (синхронно), canonical-статус изменён,
            audit event записан в той же транзакции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '400':
          description: ADMIN_REASON_REQUIRED
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN / ADMIN_SCOPE_INSUFFICIENT
          $ref: '#/components/responses/Error'

  /admin/me:
    get:
      operationId: adminMe
      summary: Получение профиля текущего администратора и его скоупа прав
      tags: [admin]
      responses:
        '200':
          description: Данные администратора и его скоуп чтения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '403':
          description: FORBIDDEN — нет активного контекста администратора
          $ref: '#/components/responses/Error'

  /admin/accounts:
    get:
      operationId: adminListAccounts
      summary: Список администраторских аккаунтов (только super_admin)
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список аккаунтов администраторов с пагинацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountListResponse'
        '403':
          description: FORBIDDEN — доступ только для super_admin
          $ref: '#/components/responses/Error'
    post:
      operationId: adminCreateAccount
      summary: Создание нового администраторского аккаунта (только super_admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminAccountRequest'
      responses:
        '201':
          description: Аккаунт администратора создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdminAccountResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN
          $ref: '#/components/responses/Error'
        '409':
          description: CONFLICT — аккаунт для данного identityId уже существует
          $ref: '#/components/responses/Error'

  /admin/accounts/{adminAccountId}/grants:
    get:
      operationId: adminListGrants
      summary: Список прав (grants), выданных администратору
      tags: [admin]
      parameters:
        - name: adminAccountId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Список выданных и отозванных прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGrantsListResponse'
        '403':
          description: FORBIDDEN
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'
    post:
      operationId: adminGrantPermission
      summary: Выдача нового разрешения администратору
      tags: [admin]
      parameters:
        - name: adminAccountId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionGrantRequest'
      responses:
        '200':
          description: Разрешение успешно выдано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantPermissionResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'

  /admin/accounts/{adminAccountId}/deactivate:
    post:
      operationId: adminDeactivateAccount
      summary: Деактивация администраторского аккаунта
      tags: [admin]
      parameters:
        - name: adminAccountId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateAdminAccountRequest'
      responses:
        '200':
          description: Аккаунт деактивирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateReactivateAccountResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'

  /admin/accounts/{adminAccountId}/reactivate:
    post:
      operationId: adminReactivateAccount
      summary: Повторная активация администраторского аккаунта
      tags: [admin]
      parameters:
        - name: adminAccountId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactivateAdminAccountRequest'
      responses:
        '200':
          description: Аккаунт активирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateReactivateAccountResponse'
        '400':
          description: VALIDATION_FAILED
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND
          $ref: '#/components/responses/Error'

  /admin/accounts/{adminAccountId}/grants/{grantId}/revoke:
