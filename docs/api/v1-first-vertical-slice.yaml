  /property-assets/{assetId}/listings/{listingId}/publish:
    post:
      operationId: publishListing
      summary: >
        MKT-002: публикация Listing (active → publication_pending, синхронная
        транзакция + асинхронная projection, ADR-005) — тот же паттерн, что
        publishDevelopment. Listing.status не меняется этой командой (в
        отличие от Development draft→active); повторный publish уже
        published/publication_pending listing отклоняется 409 (не создаёт
        дублирующую publication/version) — используйте unpublish, затем
        publish заново.
      tags: [erp-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Publication принята, статус publication_pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '404':
          description: Listing не найден / чужая организация (единый non-disclosure код)
          $ref: '#/components/responses/Error'
        '409':
          description: >
            Listing status не 'active' (draft/expired/archived) ИЛИ публикация
            уже существует в статусе, отличном от unpublished/build_failed
          $ref: '#/components/responses/Error'

  /property-assets/{assetId}/listings/{listingId}/unpublish:
    post:
      operationId: unpublishListing
      summary: >
        MKT-002: owner снимает Listing с публичного каталога — синхронная
        транзакция (тот же PublicationService.unpublish, что D-06 admin
        unpublish использует, actorType:identity вместо admin_account)
      tags: [erp-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        '201':
          description: >
            Публикация скрыта немедленно (синхронно) — 201, не 200 (Nest
            default для POST без явного @HttpCode, задокументировано как
            фактическое поведение, не переопределено этим проходом)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Publication уже не в статусе published
          $ref: '#/components/responses/Error'

  /property-assets/{assetId}/listings/{listingId}/publication-status:
    get:
      operationId: getListingPublicationStatus
      summary: >
        ERP polling после publish — читает РЕАЛЬНЫЙ статус MarketplacePublication,
        не canonical Listing.status (тот же паттерн, что D-03
        getPublicationStatus для Development)
      tags: [erp-property-assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Publication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
        '404':
          description: Listing не существует/чужой ИЛИ публикация никогда не запускалась (единый non-disclosure код)
          $ref: '#/components/responses/Error'

  /public/listings:
    get:
      operationId: searchPublicListings
      summary: >
        MKT-002: публичный поиск вторички/аренды (гость, каталог/карта) —
        тот же паттерн, что searchPublicDevelopments, дополнительно
        фильтруется по dealType/propertyType/commercialSubtype
      tags: [public-marketplace]
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: bbox
          in: query
          description: "bounding box для поиска по области карты: minLng,minLat,maxLng,maxLat"
          schema: {type: string}
        - name: city
          in: query
          schema: {type: string}
        - name: dealType
          in: query
          schema: {type: string, enum: [sale, rent_long, rent_short]}
        - name: propertyType
          in: query
          schema: {type: string, enum: [apartment, house, land, commercial]}
        - name: commercialSubtype
          in: query
          schema: {type: string, enum: [office, warehouse, retail, business, free_purpose]}
        - name: sort
          in: query
          description: "Порядок выдачи: newest, price_asc/desc или area_asc/desc."
          schema: {type: string, enum: [newest, price_asc, price_desc, area_asc, area_desc], default: newest}
      responses:
        '200':
          description: Список публичных карточек (whitelist-поля из MarketplacePublication, ADR-005)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicListingList'
        '400':
          description: VALIDATION_FAILED — невалидный cursor/limit/bbox/enum-значение или неизвестный query-параметр
          $ref: '#/components/responses/Error'

  /public/listings/{slug}:
    get:
      operationId: getPublicListing
      summary: >
        Публичная карточка Listing по slug (только status=published). Единый
        404 для "не существует" и "slug принадлежит Development/Unit, не
        Listing" (non-disclosure, тот же принцип, что getPublicDevelopment)
      tags: [public-marketplace]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Публичная карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicListingCard'
        '404':
          description: PUBLICATION_NOT_FOUND
          $ref: '#/components/responses/Error'

  /public/listings/{slug}/reveal-contact:
    post:
      operationId: revealListingContact
      summary: >
        Раскрытие контакта для листинга вторички/аренды — отдельная rate-limited
        команда, создаёт Lead и Contact в организации-владельце PropertyAsset
        (тот же паттерн, что /public/developments/{slug}/reveal-contact)
      tags: [public-marketplace]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKeyHeaderOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealContactRequest'
      responses:
        '200':
          description: Контакт раскрыт, Lead создан в организации-владельце листинга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealContactResponse'
        '400':
          description: VALIDATION_FAILED — requesterPhone обязателен для создания лида
          $ref: '#/components/responses/Error'
        '404':
          description: PUBLICATION_NOT_FOUND — публикация не найдена, не опубликована или не является листингом
          $ref: '#/components/responses/Error'
        '409':
          description: IDEMPOTENCY_KEY_CONFLICT — тот же Idempotency-Key уже использован с другим телом запроса
          $ref: '#/components/responses/Error'
        '429':
          description: RATE_LIMITED
          $ref: '#/components/responses/Error'


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: baza_session
      description: Host-only secure cookie, productAudience зашит в server-side session (ADR-004)

  parameters:
    Cursor:
      name: cursor
      in: query
      description: "Непрозрачный cursor из предыдущего ответа; для newest принимается legacy ObjectId."
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, default: 20, maximum: 100}
    DevelopmentId:
      name: developmentId
      in: path
      required: true
      schema: {type: string}
    AssetId:
      name: assetId
      in: path
      required: true
      schema: {type: string}
    MediaAssetId:
      name: mediaAssetId
      in: path
      required: true
      schema: {type: string}
    ListingId:
      name: listingId
      in: path
      required: true
      schema: {type: string}
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: ADR-006 — обязателен для publish/book/cancel/manual-ledger
    IdempotencyKeyHeaderOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, format: uuid}
      description: >
        Опционален для reveal-contact (в отличие от ADR-006 publish/book/cancel) —
        повтор без ключа сохраняет текущую совместимость (всегда новый Lead).
        С ключом: повторный запрос с тем же (slug, ключ) и тем же телом возвращает
        сохранённый ответ, не создаёт новый Lead.

  responses:
    Error:
      description: Стандартный формат ошибки (conventions.md разд.3)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    MoneyAmount:
      type: object
      required: [amountMinorUnits, currency]
      properties:
        amountMinorUnits: {type: integer, description: "Никогда float (conventions.md разд.1)"}
        currency: {type: string, enum: [USD, GEL, RUB]}

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string, description: "См. error-catalog.md"}
            message: {type: string}
            requestId: {type: string, format: uuid}
            details: {type: object, additionalProperties: true}

    CreateDevelopmentRequest:
      type: object
      required: [name, location]
      properties:
        name: {type: string}
        location:
          type: object
          required: [country, city, geo]
          properties:
            country: {type: string}
            city: {type: string}
            address: {type: string}
            geo:
              type: object
              description: "GeoJSON Point, [longitude, latitude] — жёсткое требование порядка (ADR-007)"
              properties:
                type: {type: string, enum: [Point]}
                coordinates: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
        classType: {type: string}
        completionDate: {type: string, format: date}

    Development:
      type: object
      properties:
        id: {type: string}
        organizationId: {type: string}
        name: {type: string}
        status: {type: string, enum: [draft, active, archived]}
        location: {type: object}
        version: {type: integer, description: "Optimistic concurrency (conventions.md разд.5)"}
        createdAt: {type: string, format: date-time}

    DevelopmentList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Development'}}
        nextCursor: {type: string, nullable: true}

    CreateBuildingRequest:
      type: object
      required: [name, floorsCount]
      properties:
        name: {type: string}
        floorsCount: {type: integer}
        startDate: {type: string, format: date}
        completionDate: {type: string, format: date}

    Building:
      type: object
      properties:
        id: {type: string}
        developmentId: {type: string}
        organizationId: {type: string}
        name: {type: string}
        floorsCount: {type: integer}

    CreateFloorRequest:
      type: object
      required: [floorNumber]
      properties:
        floorNumber: {type: integer}
        sectionId: {type: string, nullable: true}
        floorType: {type: string, nullable: true}

    Floor:
      type: object
      properties:
        id: {type: string}
        buildingId: {type: string}
        organizationId: {type: string}
        floorNumber: {type: integer}

    CreateUnitRequest:
      type: object
      required: [number, kind, area, price]
      properties:
        number: {type: string}
        kind: {type: string, enum: [apartment, commercial, office, parking, storage, other], description: "parking — отдельная шахматка (domain-model.md Module 4)"}
        rooms: {type: integer, nullable: true}
        area: {type: number}
        price: {$ref: '#/components/schemas/MoneyAmount'}
        floorPlanId: {type: string, nullable: true}

    Unit:
      type: object
      properties:
        id: {type: string}
        floorId: {type: string}
        buildingId: {type: string}
        organizationId: {type: string}
        number: {type: string}
        kind: {type: string}
        area: {type: number}
        price: {$ref: '#/components/schemas/MoneyAmount'}
        status: {type: string, enum: [available, reserved, sold, hidden]}
        version: {type: integer}

    PublicationStatus:
      type: object
      properties:
        id: {type: string}
        sourceType: {type: string, enum: [unit, development, listing]}
        sourceId: {type: string}
        status: {type: string, enum: [publication_pending, published, unpublished, build_failed]}
        slug: {type: string, nullable: true}
        unpublishReason: {type: string, nullable: true}

    PublicDevelopmentList:
      type: object
      required: [items, nextCursor, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PublicDevelopmentCard'}}
        nextCursor: {type: string, nullable: true}
        total: {type: integer, minimum: 0, description: "Точное число опубликованных карточек с теми же фильтрами, без учёта cursor."}

    PublicDevelopmentCard:
      type: object
      description: "Только whitelist-поля из MarketplacePublication.denormalizedFields (ADR-005) — никогда внутренние комиссии/notes/tenant-only контакты"
      properties:
        slug: {type: string}
        name: {type: string}
        location: {$ref: '#/components/schemas/PublicLocation'}
        priceFrom: {$ref: '#/components/schemas/MoneyAmount'}
        seo:
          type: object
          properties:
            title: {type: string}
            description: {type: string}
            canonicalUrl: {type: string}
            structuredData: {type: object, additionalProperties: true}

    RevealContactRequest:
      type: object
      properties:
        requesterName: {type: string}
        requesterPhone: {type: string}
        utm: {type: object, additionalProperties: true, nullable: true}

    RevealContactResponse:
      type: object
      properties:
        phone: {type: string}
        whatsapp: {type: string, nullable: true}
        telegram: {type: string, nullable: true}
        leadId: {type: string, description: "Lead создан в организации застройщика (D-05)"}

    Lead:
      type: object
      properties:
        id: {type: string}
        organizationId: {type: string}
        contactId: {type: string}
        ownerPositionId: {type: string, nullable: true}
        stage: {type: string}
        source: {type: object, additionalProperties: true}

    LeadListItem:
      type: object
      description: >
        GET /leads item shape (CrmService.CrmLeadReadModel) — contact
        встроен как whitelist-проекция {id, name, phone, email?}, никогда
        весь Contact-документ; ownerPositionId — null, если лид ещё не
        назначен ни на одну Position.
      properties:
        id: {type: string}
        organizationId: {type: string}
        ownerPositionId: {type: string, nullable: true}
        stage: {type: string, enum: [new, contacted, qualified, converted, lost]}
        version: {type: integer}
        source: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}
        contact:
          type: object
          nullable: true
          properties:
            id: {type: string}
            name: {type: string}
            phone: {type: string}
            email: {type: string, nullable: true}

    LeadListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeadListItem'
        nextCursor: {type: string, nullable: true}

    LeadEvent:
      type: object
      description: Один immutable append-only переход стадии лида (LeadEventDocument).
      properties:
        id: {type: string}
        leadId: {type: string}
        stage: {type: string, enum: [new, contacted, qualified, converted, lost]}
        changedBy:
          type: object
          properties:
            type: {type: string, enum: [position, system]}
            positionId: {type: string, nullable: true}
        changedAt: {type: string, format: date-time}

    LeadEventListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeadEvent'
        nextCursor: {type: string, nullable: true}

    PublicListingList:
      type: object
      required: [items, nextCursor, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PublicListingCard'}}
        nextCursor: {type: string, nullable: true}
        total: {type: integer, minimum: 0, description: "Точное число опубликованных карточек с теми же фильтрами, без учёта cursor."}

    PublicListingCard:
      type: object
      description: >
        MKT-002: только whitelist-поля из MarketplacePublication.denormalizedFields
        (ADR-005, apps/worker/src/handlers/listing-publication.mapper.ts) —
        никогда organizationId/publisherScope/contact/duplicate signals/audit/
        commission. media намеренно отсутствует — PropertyAsset/Listing схема
        не содержит media-поля в этом проходе (PROP-001 не включал).
      properties:
        slug: {type: string}
        dealType: {type: string, enum: [sale, rent_long, rent_short]}
        price: {$ref: '#/components/schemas/MoneyAmount'}
        propertyType: {type: string, enum: [apartment, house, land, commercial]}
        commercialSubtype: {type: string, enum: [office, warehouse, retail, business, free_purpose], nullable: true}
        location: {$ref: '#/components/schemas/PublicLocation'}
        characteristics:
          type: object
          properties:
            area: {type: number}
            rooms: {type: integer, nullable: true}
            floor: {type: integer, nullable: true}
            totalFloors: {type: integer, nullable: true}
        media:
          type: array
          items:
            $ref: '#/components/schemas/PublicMediaItem'
        seo:
          type: object
          properties:
            title: {type: string}
            description: {type: string}
            canonicalUrl: {type: string}
            structuredData: {type: object, additionalProperties: true}

    PublicLocation:
      type: object
      properties:
        country: {type: string}
        city: {type: string}
        address: {type: string}
        geo: {$ref: '#/components/schemas/PublicGeoPoint'}

    PublicGeoPoint:
      type: object
      required: [type, coordinates]
      properties:
        type: {type: string, enum: [Point]}
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: number}

    CreatePropertyAssetRequest:
      type: object
      required: [propertyType, location, characteristics, representativePhone]
      properties:
        propertyType: {type: string, enum: [apartment, house, land, commercial]}
        commercialSubtype: {type: string, enum: [office, warehouse, retail, business, free_purpose]}
        location:
          type: object
          required: [country, city, address, geo]
          properties:
            country: {type: string}
            city: {type: string}
            address: {type: string}
            geo:
              type: object
              required: [type, coordinates]
              properties:
                type: {type: string, enum: [Point]}
                coordinates: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
        characteristics:
          type: object
          required: [area]
          properties:
            area: {type: number}
            rooms: {type: integer}
            floor: {type: integer}
            totalFloors: {type: integer}
        representativePhone: {type: string}

    PropertyAsset:
      type: object
      properties:
        _id: {type: string}
        publisherScope: {type: object}
        propertyType: {type: string, enum: [apartment, house, land, commercial]}
        commercialSubtype: {type: string, enum: [office, warehouse, retail, business, free_purpose]}
        location: {type: object}
        characteristics: {type: object}
        representativePhone: {type: string}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    CreateListingRequest:
      type: object
      required: [dealType, price]
      properties:
        dealType: {type: string, enum: [sale, rent_long, rent_short]}
        price: {$ref: '#/components/schemas/MoneyAmount'}

    Listing:
      type: object
      properties:
        _id: {type: string}
        propertyAssetId: {type: string}
        publisherScope: {type: object}
        dealType: {type: string, enum: [sale, rent_long, rent_short]}
        price: {$ref: '#/components/schemas/MoneyAmount'}
        status: {type: string, enum: [draft, active, expired, archived]}
        version: {type: integer}
        lastConfirmedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    ListingActuality:
      type: object
      properties:
        status: {type: string}
        category: {type: string}
        thresholds:
          type: object
          properties:
            warningDays: {type: integer}
            overdueDays: {type: integer}
        lastConfirmedAt: {type: string, format: date-time}
        state:
          type: string
          nullable: true
          enum: [fresh, warning, overdue]

    DuplicateCandidate:
      type: object
      properties:
        id: {type: string}
        status: {type: string, enum: [detected, confirmed_duplicate, override_not_duplicate]}
        signals:
          type: object
          properties:
            phoneMatch: {type: boolean}
            addressMatch: {type: boolean}
            roomsAreaFloorMatch: {type: boolean}
        overrideReason: {type: string}
        overrideAt: {type: string, format: date-time}
        detectedAt: {type: string, format: date-time}

    PublicMediaItem:
      type: object
      required: [url, role, sortOrder]
      properties:
        url: {type: string}
        role: {type: string, enum: [cover, gallery]}
        sortOrder: {type: integer}
        alt: {type: string, nullable: true}

    CreatePropertyAssetMediaUploadIntentRequest:
      type: object
      required: [declaredMimeType, sizeBytes]
      properties:
        declaredMimeType: {type: string, enum: [image/jpeg, image/png, image/webp]}
        sizeBytes: {type: integer}
        purpose: {type: string}

    CreatePropertyAssetMediaUploadIntentResponse:
      type: object
      required: [assetId, mediaAssetId, uploadUrl]
      properties:
        assetId: {type: string}
        mediaAssetId: {type: string}
        uploadUrl: {type: string}

    ConfirmPropertyAssetMediaRequest:
      type: object
      properties:
        role: {type: string, enum: [cover, gallery]}
        sortOrder: {type: integer}
        alt: {type: string}
        isPrivate: {type: boolean}

    UpdatePropertyAssetMediaRequest:
      type: object
      properties:
        role: {type: string, enum: [cover, gallery]}
        sortOrder: {type: integer}
        alt: {type: string}
        isPrivate: {type: boolean}

    ReorderPropertyAssetMediaRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [mediaAssetId, sortOrder]
            properties:
              mediaAssetId: {type: string}
              sortOrder: {type: integer}
              role: {type: string, enum: [cover, gallery]}

    PropertyAssetMediaItem:
      type: object
      required: [id, mediaAssetId, role, sortOrder, isPrivate, status, createdAt]
      properties:
        id: {type: string}
        mediaAssetId: {type: string}
        role: {type: string, enum: [cover, gallery]}
        sortOrder: {type: integer}
        alt: {type: string, nullable: true}
        isPrivate: {type: boolean}
        status: {type: string, enum: [pending, verified, rejected]}
        sizeBytes: {type: integer, nullable: true}
        mimeType: {type: string, nullable: true}
        url: {type: string, nullable: true}
        createdAt: {type: string}

    PropertyAssetMediaListResponse:
      type: array
      items:
        $ref: '#/components/schemas/PropertyAssetMediaItem'

    DeletePropertyAssetMediaResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean}

    RegisterOrganizationRequest:
      type: object
      required: [login, password, type, name]
      properties:
        login: {type: string}
        password: {type: string, minLength: 8}
        type:
          type: string
          enum: [agency, developer, independent_realtor]
        name: {type: string, minLength: 1, maxLength: 200}

    RegisterOrganizationResponse:
      type: object
      required: [organizationId, positionId, identityId]
      properties:
        organizationId: {type: string}
        positionId: {type: string}
        identityId: {type: string}

    AdminMeResponse:
      type: object
      required: [adminAccountId, isSuperAdmin, publicationReadScope]
      properties:
        adminAccountId: {type: string}
        isSuperAdmin: {type: boolean}
        publicationReadScope:
          oneOf:
            - type: string
              enum: [all]
            - type: object
              additionalProperties:
                type: object
                required: [global, cities]
                properties:
                  global: {type: boolean}
                  cities:
                    type: array
                    items: {type: string}

    AdminAccountListItem:
      type: object
      required: [id, identityId, isSuperAdmin, status, createdAt]
      properties:
        id: {type: string}
        identityId: {type: string}
        isSuperAdmin: {type: boolean}
        status:
          type: string
          enum: [active, deactivated]
        createdAt: {type: string, format: date-time}

    AdminAccountListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccountListItem'
        nextCursor: {type: string, nullable: true}

    CreateAdminAccountRequest:
      type: object
      required: [identityId]
      properties:
        identityId: {type: string}
        isSuperAdmin: {type: boolean, default: false}

    CreateAdminAccountResponse:
      type: object
      required: [id, identityId, isSuperAdmin]
      properties:
        id: {type: string}
        identityId: {type: string}
        isSuperAdmin: {type: boolean}

    PermissionGrantItem:
      type: object
      required: [id, resource, action, scope, version]
      properties:
        id: {type: string}
        resource: {type: string}
        action: {type: string}
        scope:
          type: string
          enum: [own, position, team, organization, project, city, global, assigned, domain]
        scopeValue: {type: string, nullable: true}
        version: {type: integer}
        revokedAt: {type: string, format: date-time, nullable: true}
        revokedBy: {type: string, nullable: true}
        revokeReason: {type: string, nullable: true}

    AdminGrantsListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PermissionGrantItem'

    CreatePermissionGrantRequest:
      type: object
      required: [resource, action, scope]
      properties:
        resource: {type: string}
        action: {type: string}
        scope:
          type: string
          enum: [own, position, team, organization, project, city, global, assigned, domain]
        scopeValue: {type: string}

    GrantPermissionResponse:
      type: object
      required: [granted]
      properties:
        granted: {type: boolean}

    DeactivateAdminAccountRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 10}

    ReactivateAdminAccountRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 10}

    DeactivateReactivateAccountResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, deactivated]

    RevokePermissionGrantRequest:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: {type: integer}
        reason: {type: string, minLength: 10}

    RevokePermissionGrantResponse:
      type: object
      required: [revoked]
      properties:
        revoked: {type: boolean}

    AdminAuditEventView:
      type: object
      required: [id, action, resource, resourceId, actor, createdAt, correlationId, reason, summary, before, after]
      properties:
        id: {type: string}
        action: {type: string}
        resource: {type: string}
        resourceId: {type: string}
        actor:
          type: object
          required: [type, id]
          properties:
            type: {type: string, enum: [identity, admin_account, system]}
            id: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        correlationId: {type: string}
        reason: {type: string, nullable: true}
        summary: {type: string}
        before:
          type: object
          nullable: true
          additionalProperties: true
          description: Явный per-action whitelist (admin-audit-projection.ts) — никогда не сырой audit payload
        after:
          type: object
          nullable: true
          additionalProperties: true
          description: Явный per-action whitelist (admin-audit-projection.ts) — никогда не сырой audit payload

    AdminAuditEventListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditEventView'
        nextCursor: {type: string, nullable: true}
