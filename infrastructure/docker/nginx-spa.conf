server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    # $http_host, а НЕ $host: nginx нормализует $host и выбрасывает из него
    # порт, а порт здесь значащий — им и отличаются marketplace (4173) от
    # admin (4174) в CORS_ALLOWED_ORIGIN_*. API получал "Host: localhost",
    # строил "http://localhost", не находил совпадения и отвечал 401 на
    # GET /auth/session: браузер не шлёт Origin на same-origin GET, и хост
    # оставался единственным источником аудитории. Войти в кабинет было нельзя.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
